[package]
name = "compx-tray"
description = "Lightweight tray app for ATK / VXE (COMPX) mice"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
embed-manifest = "1.5"

[dependencies]
compx-proto = { path = "../compx-proto" }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.25"
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
