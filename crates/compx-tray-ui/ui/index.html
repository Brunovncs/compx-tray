<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COMPX Tray</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="logo.png" alt="">
    <div class="title">
      <h1>COMPX Tray</h1>
      <p id="device" data-i18n="searching"></p>
    </div>
    <div id="battery" class="battery" hidden>
      <svg viewBox="0 0 36 36" aria-hidden="true"><circle class="track" cx="18" cy="18" r="15"/><circle id="battery-ring" class="ring" cx="18" cy="18" r="15"/></svg>
      <span id="battery-text"></span>
    </div>
    <button id="theme" class="icon-btn" data-i18n-title="theme">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="mouse" aria-selected="true" data-i18n="tabMouse"></button>
    <button role="tab" data-tab="auto" data-i18n="tabAuto"></button>
    <button role="tab" data-tab="system" data-i18n="tabSystem"></button>
  </nav>

  <div id="banner" class="banner" hidden>
    <p id="banner-text"></p>
    <button id="banner-action" class="btn primary" hidden></button>
  </div>

  <div id="update" class="banner update" hidden>
    <p id="update-text"></p>
    <button id="update-action" class="btn primary" data-i18n="openHub"></button>
  </div>

  <main>
    <section data-panel="mouse">
      <h2 data-i18n="profiles"></h2>
      <div id="profiles" class="profiles"></div>

      <h2><span data-i18n="sensor"></span> <span id="settings-profile" class="note"></span></h2>
      <div id="settings" class="card">
        <div class="row column">
          <div class="row-head">
            <span class="label"><strong>DPI</strong><small data-i18n="dpiHint"></small></span>
            <span class="stepper">
              <button id="stage-remove" class="icon-btn small" data-i18n-title="removeStage">−</button>
              <button id="stage-add" class="icon-btn small" data-i18n-title="addStage">+</button>
            </span>
          </div>
          <ol id="stages" class="stages"></ol>
          <small id="dpi-note" class="hint" data-i18n="unknownSensor" hidden></small>
        </div>
        <div class="row column">
          <span class="label"><strong data-i18n="polling"></strong><small data-i18n="pollingHint"></small></span>
          <div id="polling" class="segmented"></div>
        </div>
        <div class="row" id="lift-off-row">
          <span class="label"><strong data-i18n="liftOff"></strong><small data-i18n="liftOffHint"></small></span>
          <select id="lift-off"></select>
        </div>
        <div class="row">
          <span class="label"><strong data-i18n="debounce"></strong><small data-i18n="debounceHint"></small></span>
          <select id="debounce"></select>
        </div>
        <div class="row column" id="sensor-mode-row">
          <span class="label"><strong data-i18n="sensorMode"></strong></span>
          <div id="sensor-mode" class="segmented"></div>
        </div>
        <label class="row toggle"><span class="label"><strong data-i18n="motionSync"></strong><small data-i18n="motionSyncHint"></small></span><input type="checkbox" id="motion-sync"><i></i></label>
        <label class="row toggle"><span class="label"><strong data-i18n="angleSnap"></strong><small data-i18n="angleSnapHint"></small></span><input type="checkbox" id="angle-snap"><i></i></label>
        <label class="row toggle"><span class="label"><strong data-i18n="ripple"></strong><small data-i18n="rippleHint"></small></span><input type="checkbox" id="ripple"><i></i></label>
      </div>
      <div id="settings-error" class="card error" hidden>
        <p id="settings-error-text"></p>
        <button id="settings-retry" class="btn" data-i18n="retry"></button>
      </div>
    </section>

    <section data-panel="auto" hidden>
      <div class="card">
        <label class="row toggle"><span class="label"><strong data-i18n="autoSwitch"></strong><small data-i18n="autoSwitchHint"></small></span><input type="checkbox" id="auto-switch"><i></i></label>
        <div class="row column">
          <span class="label"><strong data-i18n="ruleMode"></strong><small id="rule-mode-hint"></small></span>
          <div id="rule-mode" class="segmented">
            <button data-mode="running" data-i18n="modeRunning"></button>
            <button data-mode="focused" data-i18n="modeFocused"></button>
          </div>
        </div>
        <div class="row">
          <span class="label"><strong data-i18n="defaultProfile"></strong><small data-i18n="defaultProfileHint"></small></span>
          <select id="default-profile"></select>
        </div>
      </div>

      <h2 data-i18n="rules"></h2>
      <div class="card">
        <ul id="rules" class="rules"></ul>
        <p id="rules-empty" class="empty" data-i18n="rulesEmpty"></p>
        <form id="add-rule" class="add-rule">
          <input id="rule-exe" list="programs" data-i18n-placeholder="rulePlaceholder" autocomplete="off" spellcheck="false">
          <datalist id="programs"></datalist>
          <select id="rule-profile"></select>
          <button type="submit" class="btn primary" data-i18n="add"></button>
        </form>
      </div>
      <p class="hint" data-i18n="rulesHint"></p>
    </section>

    <section data-panel="system" hidden>
      <div class="card">
        <label class="row toggle"><span class="label"><strong data-i18n="autostart"></strong><small data-i18n="autostartHint"></small></span><input type="checkbox" id="autostart"><i></i></label>
        <label class="row toggle"><span class="label"><strong data-i18n="osd"></strong><small data-i18n="osdHint"></small></span><input type="checkbox" id="osd"><i></i></label>
        <label class="row toggle"><span class="label"><strong data-i18n="hotkeys"></strong><small data-i18n="hotkeysHint"></small></span><input type="checkbox" id="hotkeys"><i></i></label>
      </div>

      <h2 data-i18n="backups"></h2>
      <div class="card">
        <div class="row">
          <span class="label"><strong data-i18n="backupNow"></strong><small data-i18n="backupHint"></small></span>
          <button id="backup" class="btn" data-i18n="save"></button>
        </div>
        <ul id="backups" class="backups"></ul>
      </div>

      <h2 data-i18n="device"></h2>
      <div class="card">
        <dl id="device-info" class="info"></dl>
      </div>
    </section>
  </main>

  <footer data-i18n="footer"></footer>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="main.js"></script>
</body>
</html>
